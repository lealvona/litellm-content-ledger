[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-content-ledger"
version = "0.1.0"
description = "Record the full request and response of every LiteLLM proxy call, off the request path, with retention and search."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
content-ledger = "content_ledger.cli:main"
fcl = "content_ledger.cli:fcl_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
